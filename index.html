<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor-principal">
        <!-- Seccion del Formulario -->
        <section class="seccion-formulario">
            <form novalidate>

                <!-- Nombre Completo -->
                <div class="grupo-formulario">
                    <label for="nombre-completo">Nombre Completo</label>
                    <input type="text" id="nombre-completo" name="nombre-completo"
                        placeholder="Como deberíamos llamarte" required aria-required="true" />
                </div>

                <!-- Correo Electrónico (Con Estado de Error) -->
                <div class="grupo-formulario error">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" value="juan@ejemplo.com" required aria-required="true"
                        aria-invalid="true" aria-describedby="error-correo" />
                    <span id="error-correo" class="mensaje-error" role="alert">
                        El correo electrónico ya está registrado
                    </span>
                </div>

                <!-- Contraseña -->
                <div class="grupo-formulario">
                    <label for="contrasena">Ingresar Contraseña</label>
                    <div class="contenedor-input-clave">
                        <input type="password" id="contrasena" name="contrasena" value="XXXXXXXX" required
                            aria-required="true" />
                        <button type="button" class="boton-alternar-clave" aria-label="Mostrar u ocultar contraseña"
                            title="Mostrar u ocultar contraseña">
                            <img src="eye.svg" alt="" class="icono-ojo" aria-hidden="true" />
                        </button>
                    </div>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">Confirmar Contraseña</label>
                    <div class="contenedor-input-clave">
                        <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" value="XXXXXXXX"
                            required aria-required="true" />
                        <button type="button" class="boton-alternar-clave"
                            aria-label="Mostrar u ocultar contraseña de confirmación"
                            title="Mostrar u ocultar contraseña">
                            <img src="eye.svg" alt="" class="icono-ojo" aria-hidden="true" />
                        </button>
                    </div>
                </div>

                <!-- Actualización -->
                <button type="submit" class="boton-guardar">
                    Actualizar Perfil
                </button>

            </form>
        </section>

        <!-- Progreso del Perfil -->
        <aside class="seccion-lateral">

            <!-- Barra de Progreso -->
            <div class="contenedor-progreso">
                <div class="circulo-progreso" role="progressbar" aria-valuenow="65" aria-valuemin="0"
                    aria-valuemax="100" aria-label="Porcentaje de perfil completado">
                    <span class="valor-progreso">65%</span>
                </div>
                <h2 class="titulo-progreso">Integridad del Perfil</h2>
            </div>

            <!-- Lista de Tareas -->
            <ul class="lista-tareas">
                <li class="completada"><del>Crear Cuenta</del></li>
                <li class="completada"><del>Actualizar Progreso</del></li>
                <li class="completada"><del>Configurar Perfil Público</del></li>
                <li>Completar tu primer proyecto</li>
                <li>Invitar a tus amigos</li>
            </ul>

        </aside>
    </main>

</body>

</html>
